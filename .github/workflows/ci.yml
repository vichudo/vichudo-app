name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build validates env vars; CI has no secrets or database to give it.
      SKIP_ENV_VALIDATION: '1'
      # Better Auth refuses its default secret in production builds. A
      # placeholder for CI only; real deployments set their own.
      BETTER_AUTH_SECRET: ci-placeholder-secret-never-used-for-real-sessions
    steps:
      - uses: actions/checkout@v7
      # Installs the pnpm version pinned in package.json `packageManager`.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint --format github
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  create-app:
    name: create-vichudo-app smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # Create an app from this commit, exactly as `pnpm create vichudo-app`
      # would from GitHub, then hold it to the same bar as the template.
      - run: node cli/index.js "$RUNNER_TEMP/smoke-app" --template "file://$GITHUB_WORKSPACE" --yes --no-git
      - run: pnpm check && pnpm build
        working-directory: ${{ runner.temp }}/smoke-app
