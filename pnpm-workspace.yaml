# pnpm reads its settings from here, not from package.json or .npmrc.
# https://pnpm.io/settings
#
# Supply-chain defaults stay on: a release must be a day old before it can be
# installed (`minimumReleaseAge`), and exotic transitive sources are blocked.

# Dependencies allowed to run install scripts. Anything not listed fails the
# install (`strictDepBuilds`), so a new native dependency is a deliberate choice.
allowBuilds:
  # Prisma 7's CLI (`@prisma/prisma7` wraps `prisma@7`), kept only for
  # `prisma7 dev` (local Postgres) and Studio.
  '@prisma/engines': true
  prisma: true
  # Prisma 8's CLI ships its deploy tooling (Composer) along with the ORM
  # commands. These scripts only check platform binaries; the ORM commands
  # do not need them.
  esbuild: false
  workerd: false

# One `pg` for the app: Prisma pins its own, but runs on the app's pool
# (`src/server/db.ts`), so a second copy only brings a clashing `Pool` type.
overrides:
  pg: $pg
  '@types/pg': $@types/pg

# What else dependencies may do. tRPC and Prisma ship agent skills that
# document the installed version; pnpm links them into `.claude/skills`
# (gitignored).
# Named explicitly: pnpm otherwise detects agents on the machine, and fails the
# install where it finds none (CI, editors other than Claude Code).
skills:
  dirs:
    - .claude/skills

permissions:
  '@prisma/orm-postgres':
    skills: true
  '@trpc/client':
    skills: true
  '@trpc/server':
    skills: true
  '@trpc/tanstack-react-query':
    skills: true
